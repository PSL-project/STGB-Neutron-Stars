[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "stgb-neutron-stars"
version = "0.1.0"
description = "Exploratory Ricci-Gauss-Bonnet scalarized neutron-star calculations and diagnostics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT (software only; see data/README.md)"}
authors = [{name = "Research project contributors"}]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "pandas>=2.1,<4", "matplotlib>=3.8,<4"]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
stgb-plots = "stgb.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
