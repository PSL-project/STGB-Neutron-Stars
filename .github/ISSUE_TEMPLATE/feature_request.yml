name: "Feature request"
description: "Suggest an improvement to the solver, EOS support, figures, or documentation."
title: "[Feature] "
body:
  - type: textarea
    id: motivation
    attributes:
      label: Problem or motivation
      description: What scientific or technical need does this address?
      placeholder: I would like to compare additional EOS tables...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the requested functionality and a plausible approach.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Scientific and numerical considerations
      description: Does this change units, boundary conditions, runtime, outputs, or physical assumptions?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and references
      description: Add relevant literature, examples, or other possible approaches.
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests.
          required: true
