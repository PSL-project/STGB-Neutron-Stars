
    
  
name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate neutron-star icon
        run: python tools/generate_neutron_star_icon.py

      - name: Build single-file GUI executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name "STGB neutron star" `
            --icon "assets/neutron_star.ico" `
            --add-data "data;data" `
            --paths "src" `
            --collect-all matplotlib `
            --hidden-import=matplotlib.backends.backend_pdf `
            --hidden-import=matplotlib.backends.backend_tkagg `
            --hidden-import=matplotlib.backends.backend_agg `
            "gui_run.py"

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: STGB-neutron-star-Windows-x64
          path: dist/STGB neutron star.exe
          if-no-files-found: error

      - name: Create GitHub release and attach executable
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "dist/STGB neutron star.exe" --title "STGB Neutron Stars ${{ github.ref_name }}" --generate-notes

